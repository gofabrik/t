name: upstreamwatch

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Exit 0: nothing new. Exit 2: the report needs action. Anything
      # else is a broken run and fails the job here; later steps never
      # advance markers or file issues from a partial report.
      - id: watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          go run ./cmd/upstreamwatch -advance | tee report.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          if [ "$rc" -eq 2 ] && ! grep -qE '^(SECURITY|STALE|RELEASE)' report.txt; then
            echo "exit 2 without an attention line; treating as an error" >&2
            exit 1
          fi
      - name: report new commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet cmd/upstreamwatch/last_alerted; then
            exit 0
          fi
          gh label create upstream-port --force
          issue="$(gh issue list --label upstream-port --state open --json number --jq '.[0].number')"
          if [ -z "$issue" ]; then
            gh issue create --title "Unported upstream commits" --label upstream-port --body-file report.txt
          else
            gh issue comment "$issue" --body-file report.txt
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "upstreamwatch: advance last_alerted" cmd/upstreamwatch/last_alerted
          git pull --rebase origin main
          git push
      - name: report security-relevant commits
        if: steps.watch.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q '^SECURITY' report.txt; then
            exit 0
          fi
          gh label create security-review --force
          issue="$(gh issue list --label security-review --state open --json number --jq '.[0].number')"
          if [ -z "$issue" ]; then
            gh issue create --title "Security-relevant upstream commits" --label security-review --body-file report.txt
          else
            echo "security issue #$issue already open"
          fi
