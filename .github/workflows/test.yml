name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go test ./...

  # Informational: the next release candidate, so the coming major's
  # sync is pre-validated before it lands.
  next:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: |
          next="$(curl -fsSL 'https://go.dev/dl/?mode=json&include=all' | jq -r '.[0] | select(.stable == false) | .version')"
          if [ -z "$next" ]; then
            echo "no prerelease newer than stable"
            exit 0
          fi
          GOTOOLCHAIN="$next" go build ./...
          GOTOOLCHAIN="$next" go test ./...
